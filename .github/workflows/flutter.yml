name: Flutter SDK acceptance
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: flutter-validation-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  PYTHONUTF8: '1'
jobs:
  libraries:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
        flutter: ['3.44.0', '3.47.6']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ matrix.flutter }}
          channel: stable
          cache: true
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev xvfb
      - run: python tool/ci_environment.py
      - run: python -m unittest discover -s tool -p 'test_*.py'
      - name: Normal and minimum dependency acceptance
        run: |
          mkdir -p .local/flutter-validation
          prefix=''
          if [ '${{ runner.os }}' = 'Linux' ]; then prefix='xvfb-run -a'; fi
          $prefix python tool/verify.py --browser | tee .local/flutter-validation/normal.log
          $prefix python tool/verify.py --downgrade | tee .local/flutter-validation/minimum.log
      - name: Package dry runs and public API documentation
        if: matrix.os == 'ubuntu-24.04' && matrix.flutter == '3.47.6'
        shell: bash
        run: |
          python tool/documentation.py | tee .local/flutter-validation/documentation.log
          python tool/archive.py | tee .local/flutter-validation/archive.log
      - name: Desktop runtime
        shell: bash
        run: |
          case '${{ runner.os }}' in
            Linux) device=linux; prefix='xvfb-run -a' ;;
            Windows) device=windows; prefix='' ;;
            macOS) device=macos; prefix='' ;;
          esac
          $prefix python tool/native_acceptance.py --device "$device"
      - name: Fresh application and optional generator rehearsal
        if: matrix.os == 'macos-15' && matrix.flutter == '3.47.6'
        run: python3 tool/quickstart.py | tee .local/flutter-validation/quickstart.log
      - name: Minimum toolchain Web JavaScript and Wasm build
        if: matrix.os == 'ubuntu-24.04' && matrix.flutter == '3.44.0'
        shell: bash
        run: |
          cd examples/basic
          flutter build web --release --no-web-resources-cdn
          cd ../gen_l10n
          flutter build web --release --wasm --no-web-resources-cdn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flutter-libraries-${{ matrix.os }}-${{ matrix.flutter }}-${{ github.sha }}
          path: .local/flutter-validation/
          retention-days: 14
          if-no-files-found: error
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.6'
          cache: true
      - run: flutter pub get
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Basic integration in a fresh emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          arch: x86_64
          avd-name: localisync-basic
          script: |
            python3 tool/native_acceptance.py --device emulator-5554 --example basic
      - name: Generated integration in a separate fresh emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          arch: x86_64
          avd-name: localisync-generated
          script: |
            python3 tool/native_acceptance.py --device emulator-5554 --example gen_l10n
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flutter-android-${{ github.sha }}
          path: .local/flutter-validation/
          retention-days: 14
          if-no-files-found: error
  browsers:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.6'
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: flutter pub get
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: mkdir -p .local/flutter-validation && python3 tool/browsers.py | tee .local/flutter-validation/browsers.log
      - run: python3 tool/dependencies.py --audit | tee .local/flutter-validation/dependencies.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flutter-browsers-${{ github.sha }}
          path: .local/flutter-validation/
          retention-days: 14
          if-no-files-found: error
  ios:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.6'
          cache: true
      - run: flutter pub get
      - name: Boot available iPhone simulator and run both integrations
        run: python3 tool/ios_acceptance.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flutter-ios-${{ github.sha }}
          path: .local/flutter-validation/
          retention-days: 14
          if-no-files-found: error
  web-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.6'
          cache: true
      - run: python3 tool/full_browser.py --build-only
      - uses: actions/upload-artifact@v4
        with:
          name: flutter-web-apps-${{ github.sha }}
          path: .local/flutter-web/
          retention-days: 7
          if-no-files-found: error
  web-ui:
    needs: web-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            browsers: chromium,firefox,webkit
          - os: windows-2022
            browsers: edge
          - os: macos-15
            browsers: safari
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: flutter-web-apps-${{ github.sha }}
          path: .local/flutter-web/
      - if: runner.os == 'Linux'
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - if: runner.os == 'Windows'
        run: pnpm exec playwright install msedge
      - name: Full Flutter applications
        env:
          SDK_BROWSER_TARGETS: ${{ matrix.browsers }}
        run: |
          mkdir -p .local/flutter-validation
          if [ '${{ runner.os }}' = 'macOS' ]; then
            sudo safaridriver --enable
            safaridriver -p 4447 > .local/flutter-validation/safaridriver.log 2>&1 &
            driver_pid=$!
            trap 'kill "$driver_pid"' EXIT
          fi
          node test/sdk-protocol/flutter-browser.mjs | tee .local/flutter-validation/web-ui.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flutter-web-ui-${{ matrix.os }}-${{ github.sha }}
          path: .local/flutter-validation/
          retention-days: 14
          if-no-files-found: error
